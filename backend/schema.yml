components:
  schemas:
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        issue_date:
          type: string
          format: date
        issuer:
          type: string
          maxLength: 200
        image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        participant:
          type: integer
      required:
      - id
      - issue_date
      - issuer
      - participant
      - title
    CertificateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        issue_date:
          type: string
          format: date
        issuer:
          type: string
          minLength: 1
          maxLength: 200
        image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        participant:
          type: integer
      required:
      - issue_date
      - issuer
      - participant
      - title
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        participants:
          type: array
          items:
            type: integer
      required:
      - created_at
      - id
      - messages
      - participants
    ConversationRequest:
      type: object
      properties:
        participants:
          type: array
          items:
            type: integer
      required:
      - participants
    Hackathon:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organizer_name:
          type: string
          readOnly: true
        participants_count:
          type: string
          readOnly: true
        teams_count:
          type: string
          readOnly: true
        submissions_count:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        deadline:
          type: string
          nullable: true
          maxLength: 100
        location:
          type: string
          nullable: true
          maxLength: 200
        type:
          $ref: '#/components/schemas/TypeEnum'
        interest:
          type: string
          nullable: true
          maxLength: 100
        prize:
          type: string
          nullable: true
          maxLength: 100
        status:
          $ref: '#/components/schemas/HackathonStatusEnum'
        logo_text:
          type: string
          nullable: true
          maxLength: 10
        keywords:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        organizer:
          type: integer
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - organizer
      - organizer_name
      - participants_count
      - start_date
      - submissions_count
      - teams_count
      - title
      - updated_at
    HackathonRegistration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        participant_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/HackathonRegistrationStatusEnum'
          readOnly: true
        motivation:
          type: string
          nullable: true
        registered_at:
          type: string
          format: date-time
          readOnly: true
        hackathon:
          type: integer
          readOnly: true
        participant:
          type: integer
          readOnly: true
      required:
      - hackathon
      - id
      - participant
      - participant_name
      - registered_at
      - status
    HackathonRegistrationRequest:
      type: object
      properties:
        motivation:
          type: string
          nullable: true
    HackathonRegistrationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - En attente
        * `approved` - Approuvé
        * `rejected` - Rejeté
    HackathonRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        deadline:
          type: string
          nullable: true
          maxLength: 100
        location:
          type: string
          nullable: true
          maxLength: 200
        type:
          $ref: '#/components/schemas/TypeEnum'
        interest:
          type: string
          nullable: true
          maxLength: 100
        prize:
          type: string
          nullable: true
          maxLength: 100
        status:
          $ref: '#/components/schemas/HackathonStatusEnum'
        logo_text:
          type: string
          nullable: true
          maxLength: 10
        keywords:
          type: string
          nullable: true
          maxLength: 255
      required:
      - end_date
      - start_date
      - title
    HackathonStatusEnum:
      enum:
      - brouillon
      - publie
      - attente
      - termine
      type: string
      description: |-
        * `brouillon` - Brouillon
        * `publie` - Publié
        * `attente` - En attente
        * `termine` - Terminé
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        content:
          type: string
        attachment_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        conversation:
          type: integer
        sender:
          type: integer
          readOnly: true
      required:
      - content
      - conversation
      - created_at
      - id
      - sender
      - sender_name
    MessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        attachment_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        conversation:
          type: integer
      required:
      - content
      - conversation
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
      required:
      - created_at
      - id
      - message
      - title
      - user
    NotificationRequest:
      type: object
